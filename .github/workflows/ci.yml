name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # -p 1: тесты работают с временными SQLite и не должны конкурировать за CPU.
      - name: go test
        run: go test -p 1 -race -count=1 ./...

      - name: build
        run: go build -trimpath ./...
